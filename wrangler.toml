# https://developers.cloudflare.com/workers/wrangler/configuration

name = "sources"
compatibility_date = "2026-03-26"

compatibility_flags = ["nodejs_compat"]

pages_build_output_dir = ".svelte-kit/cloudflare"

[[d1_databases]]
binding = "DB_Ontology"
database_name = "Ontology_9494_2026-06-25"
database_id = "8ca85ff3-063d-4d6b-8438-9bb68e264206"

[[d1_databases]]
binding = "DB_Auth"
database_name = "Auth"
database_id = "c547b234-05fd-4923-ab0e-689d993894ad"

[[r2_buckets]]
binding = "R2_db_backups"
bucket_name = "db-backups"

[placement]
mode = "off" # necessary to ensure read replication is taken advantage of, i.e., app will execute code at edge, not at datacenter
