name: 'Setup TaBiThA Workspace'
description: 'Shared checkout, toolchain setup, caching, and dependencies'

runs:
  using: 'composite'
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: '.bun-version'

    - name: Setup Turborepo cache
      uses: actions/cache@v6
      with:
        path: |
          .turbo
          node_modules/.cache/turbo
        key: turbo-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Scaffold environment configuration
      shell: bash
      run: bun run setup:env
