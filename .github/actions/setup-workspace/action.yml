name: 'Setup TaBiThA Workspace'
description: 'Shared checkout, toolchain setup, caching, host mapping, and dependencies'

inputs:
  node-version:
    description: 'Node.js version'
    default: '24'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Setup Turborepo cache
      uses: actions/cache@v4
      with:
        path: |
          .turbo
          node_modules/.cache/turbo
        key: turbo-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-

    - name: Map localhost.tabitha.bible domain
      shell: bash
      run: echo "127.0.0.1 localhost.tabitha.bible" | sudo tee -a /etc/hosts

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline

    - name: Scaffold environment configuration
      shell: bash
      run: pnpm setup:env
