name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code_quality:
    name: Code Quality & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      - name: Typecheck & Svelte Diagnostics
        run: pnpm check

  security_compliance:
    name: Security & Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      - name: Architectural Philosophy Verification
        run: pnpm check:philosophies

      - name: Secret & Credential Leak Scan
        run: pnpm check:secrets

      - name: Cloudflare Workers Configuration Audit
        run: pnpm check:cloudflare

      - name: Markdown Specification Lint
        run: pnpm check:md

  unit_tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      - name: In-Memory Unit Tests & Coverage Report
        run: pnpm test:coverage

  production_build:
    name: Production Bundle Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      - name: Production Bundle Verification
        run: pnpm build

  e2e_tests:
    name: Playwright E2E Tests
    needs: [production_build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      - name: Production Bundle Verification
        run: pnpm build

      - name: Bootstrap Local D1 SQLite Snapshots
        run: pnpm db:load

      - name: Cache Playwright Chromium
        id: playwright_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium & System Dependencies
        if: steps.playwright_cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright OS Dependencies on Cache Hit
        if: steps.playwright_cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Execute Playwright End-to-End Suite
        run: pnpm test:e2e

      - name: Upload Playwright Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/*/playwright-report/
            apps/*/test-results/
          retention-days: 7
